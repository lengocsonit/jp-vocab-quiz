<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn từ vựng tiếng Nhật</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>

<div id="leaderboard-widget" class="leaderboard-widget hidden">
  <div class="lb-header">
    <h3>🏆 Bảng xếp hạng</h3>
    <select id="leaderboard-filter" class="lb-filter-select">
      <option value="all">Tổng</option>
    </select>
  </div>
  <ol id="leaderboard-list"></ol>
  <button id="leaderboard-toggle" class="lb-toggle-btn hidden">Xem thêm</button>
</div>

<div id="history-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="history-modal-title">Lịch sử làm bài</h3>
      <button id="history-modal-close" class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div id="history-loading" class="loading-row hidden"><span class="spinner"></span> Đang tải...</div>
      <p id="history-empty" class="muted hidden">Chưa có lịch sử.</p>
      <div class="table-scroll">
        <table id="history-table" class="history-table hidden">
          <thead>
            <tr><th>Ngày giờ</th><th>Lĩnh vực</th><th>Đúng/Tổng</th><th>Tỉ lệ</th><th>Thời gian</th></tr>
          </thead>
          <tbody id="history-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<main class="container">

  <!-- SETUP SCREEN -->
  <section id="setup-screen">
    <h1>Ôn từ vựng tiếng Nhật</h1>

    <div class="field">
      <label for="name-input">Tên của bạn (chỉ chữ cái A-Z, a-z và số)</label>
      <input type="text" id="name-input" maxlength="20" placeholder="vd: SonLN" list="name-suggestions" autocomplete="off">
      <datalist id="name-suggestions"></datalist>
      <p class="error-text" id="name-error"></p>
    </div>

    <div class="field">
      <label>Chế độ</label>
      <div class="radio-row mode-row">
        <label><input type="radio" name="mode" value="vocab" checked> 📚 Ôn từ vựng</label>
        <label><input type="radio" name="mode" value="test"> 📝 Làm bài test</label>
      </div>
    </div>

    <div class="field">
      <label>Chọn lĩnh vực</label>
      <div id="group-list" class="group-list">
        <div class="loading-row"><span class="spinner"></span> Đang tải danh sách từ...</div>
      </div>
    </div>

    <div class="field">
      <label id="count-label" for="count-select">Số từ muốn ôn</label>
      <select id="count-select">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="all">Toàn bộ lĩnh vực đã chọn</option>
      </select>
    </div>

    <div class="field" id="direction-field">
      <label>Hướng câu hỏi</label>
      <div class="radio-row">
        <label><input type="radio" name="direction" value="jp2meaning" checked> Từ Nhật → Nghĩa</label>
        <label><input type="radio" name="direction" value="meaning2jp"> Nghĩa → Từ Nhật</label>
        <label><input type="radio" name="direction" value="mix"> Trộn cả hai</label>
      </div>
    </div>

    <p class="error-text" id="setup-error"></p>
    <button id="start-btn" class="primary-btn">Bắt đầu</button>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="quiz-screen" class="hidden">
    <div class="quiz-progress">
      <span id="quiz-progress-text"></span>
      <span id="quiz-timer">⏱ 00:00</span>
    </div>

    <div class="quiz-settings-row">
      <button id="toggle-reading-btn" class="link-btn">👁 Hiện cách đọc</button>
      <label class="checkbox-row small"><input type="checkbox" id="auto-advance-checkbox" checked> Tự động chuyển câu (3s)</label>
    </div>

    <div class="question-card">
      <div id="question-text" class="question-text"></div>
      <div id="question-reading" class="question-reading"></div>
    </div>

    <button id="mark-word-btn" class="link-btn mark-btn">☆ Đánh dấu ôn lại</button>

    <button id="reveal-btn" class="secondary-btn">Hiện đáp án</button>

    <div id="answers" class="answers hidden"></div>

    <div id="feedback" class="feedback hidden">
      <p id="feedback-result"></p>
      <p id="feedback-example"></p>
      <p id="feedback-example-meaning"></p>
      <button id="next-btn" class="primary-btn">Câu tiếp theo</button>
    </div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="result-screen" class="hidden">
    <h1>Kết quả</h1>
    <p id="result-name"></p>
    <p id="result-score"></p>
    <p id="result-accuracy"></p>
    <p id="result-time"></p>

    <div id="result-congrats" class="result-congrats hidden">
      <p id="result-points-earned"></p>
      <p id="result-rank-message"></p>
    </div>

    <div id="wrong-list-wrap" class="hidden">
      <h3 id="wrong-list-title">Các từ trả lời sai</h3>
      <ul id="wrong-list"></ul>
    </div>

    <button id="replay-btn" class="primary-btn">Chơi lại</button>
  </section>

</main>

<script src="config.js?v=2"></script>
<script src="app.js?v=26"></script>
</body>
</html>
